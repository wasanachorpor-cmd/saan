services:
  - type: web
    name: saan
    runtime: python
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SAAN_SECRET_KEY
        generateValue: true
      - key: SAAN_SEED_DEMO
        value: "false"
      - key: SAAN_SESSION_HTTPS_ONLY
        value: "true"
      - key: SAAN_GEMINI_API_KEY
        sync: false
      - key: SAAN_PUBLIC_BASE_URL
        sync: false
